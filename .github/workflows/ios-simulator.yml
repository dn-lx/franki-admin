name: Build and Test FrankiFlow Admin App iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'
      - 'eas.json'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://bdeajozhylypiidrldka.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FX7QKUBZQmwykGcgv8SdfQ_lGRZF8n2

jobs:
  ios-simulator:
    name: Build, install and launch FrankiFlow Admin App on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: npx pod-install@latest ios

      - name: Build Release app for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$PROJECT"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$PROJECT" .xcodeproj)"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH="$(find ios-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "$APP_PATH" > ios-app-path.txt
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" FrankiFlow-Admin-App-iOS-Simulator.zip

      - name: Install and launch FrankiFlow Admin App on iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-smoke-test
          APP_PATH="$(cat ios-app-path.txt)"

          UDID="$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name',''):
                      print(d['udid'])
                      raise SystemExit
          raise SystemExit('No available iPhone Simulator found')
          PY
          )"

          echo "Using simulator $UDID" | tee ios-smoke-test/simulator.txt
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl get_app_container "$UDID" de.frankiflow.admin | tee ios-smoke-test/app-container.txt

          xcrun simctl spawn "$UDID" log config --mode level:debug 2>/dev/null || true
          xcrun simctl launch "$UDID" de.frankiflow.admin | tee ios-smoke-test/launch.txt
          sleep 12

          xcrun simctl io "$UDID" screenshot ios-smoke-test/login-screen.png
          xcrun simctl spawn "$UDID" log show --style compact --last 2m --predicate 'process CONTAINS[c] "Franki" OR eventMessage CONTAINS[c] "de.frankiflow.admin"' > ios-smoke-test/runtime.log || true

          if grep -Eiq 'uncaught exception|terminating app|fatal error|SIGABRT' ios-smoke-test/runtime.log; then
            echo 'Potential fatal iOS runtime error detected.' | tee ios-smoke-test/result.txt
            exit 1
          fi

          echo 'PASS: iOS Simulator build installed and FrankiFlow Admin App launched without a detected fatal startup error.' | tee ios-smoke-test/result.txt

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: FrankiFlow-Admin-App-iOS-Simulator
          path: FrankiFlow-Admin-App-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrankiFlow-Admin-App-iOS-Smoke-Test
          path: ios-smoke-test
          if-no-files-found: warn
          retention-days: 30
