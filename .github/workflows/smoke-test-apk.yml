name: Smoke Test FrankiFlow Admin App APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Android build workflow run ID containing the APK artifact'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke-test:
    name: Install and launch FrankiFlow Admin App APK on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download APK from selected successful build
        uses: actions/download-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-1.2.0
          path: release
          repository: dn-lx/franki-admin
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and test FrankiFlow Admin App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -eu
            mkdir -p smoke-test-output
            APK="$(find release -maxdepth 1 -name '*.apk' -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell pm list packages | grep 'package:de.frankiflow.admin'
            adb logcat -c
            adb shell monkey -p de.frankiflow.admin -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > smoke-test-output/window-focus-initial.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/window-focus-initial.txt
            adb shell uiautomator dump /sdcard/window-initial.xml
            adb pull /sdcard/window-initial.xml smoke-test-output/window-initial.xml
            adb exec-out screencap -p > smoke-test-output/login-screen-initial.png
            grep -Eiq 'FrankiFlow Admin App|Willkommen zurück|Welcome back' smoke-test-output/window-initial.xml
            grep -Eiq 'Anmelden|Sign in' smoke-test-output/window-initial.xml
            grep -Eiq 'info@frankiflow.de' smoke-test-output/window-initial.xml
            adb logcat -d > smoke-test-output/logcat.txt
            adb shell dumpsys package de.frankiflow.admin > smoke-test-output/package.txt
            adb shell ps -A | grep 'de.frankiflow.admin' > smoke-test-output/process.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/process.txt
            ! sh -c "grep -A12 'FATAL EXCEPTION' smoke-test-output/logcat.txt | grep -q 'de.frankiflow.admin'"
            echo 'PASS: FrankiFlow Admin App APK installed and launched without a fatal app crash.' | tee smoke-test-output/result.txt

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-Smoke-Test
          path: smoke-test-output
          if-no-files-found: warn
          retention-days: 30
