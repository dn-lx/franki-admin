name: Smoke Test Existing APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke-test:
    name: Install, launch and exercise APK on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download APK from successful build
        uses: actions/download-artifact@v4
        with:
          name: FrankiAdmin-Android
          path: release
          repository: dn-lx/franki-admin
          run-id: 34446742238
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and test Franki Admin
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -eu
            mkdir -p smoke-test-output
            adb install -r release/FrankiAdmin-Android.apk
            adb shell pm list packages | grep 'package:de.frankiflow.admin'
            adb logcat -c
            adb shell monkey -p de.frankiflow.admin -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > smoke-test-output/window-focus-initial.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/window-focus-initial.txt
            adb shell uiautomator dump /sdcard/window-initial.xml
            adb pull /sdcard/window-initial.xml smoke-test-output/window-initial.xml
            adb exec-out screencap -p > smoke-test-output/login-screen-initial.png
            grep -Eiq 'Franki Admin' smoke-test-output/window-initial.xml
            grep -Eiq 'Admin login' smoke-test-output/window-initial.xml
            grep -Eiq 'Sign in' smoke-test-output/window-initial.xml
            grep -Eiq 'info@frankiflow.de' smoke-test-output/window-initial.xml
            adb shell input tap 540 1515
            adb shell input text 'DefinitelyWrong123'
            adb shell input keyevent 4
            sleep 1
            adb shell input tap 540 1684
            sleep 8
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > smoke-test-output/window-focus-after-login.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/window-focus-after-login.txt
            adb shell uiautomator dump /sdcard/window-after-login.xml
            adb pull /sdcard/window-after-login.xml smoke-test-output/window-after-login.xml
            adb exec-out screencap -p > smoke-test-output/login-screen-after-invalid-login.png
            adb logcat -d > smoke-test-output/logcat.txt
            adb shell dumpsys package de.frankiflow.admin > smoke-test-output/package.txt
            adb shell ps -A | grep 'de.frankiflow.admin' > smoke-test-output/process.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/process.txt
            ! sh -c "grep -A12 'FATAL EXCEPTION' smoke-test-output/logcat.txt | grep -q 'de.frankiflow.admin'"
            grep -Eiq 'Invalid login credentials|invalid.*credentials' smoke-test-output/window-after-login.xml
            echo 'PASS: APK installed; Franki Admin launched and rendered; login controls worked; Supabase Auth returned the expected invalid-credentials response; no fatal app crash was detected.' | tee smoke-test-output/result.txt

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrankiAdmin-Android-Smoke-Test
          path: smoke-test-output
          if-no-files-found: warn
          retention-days: 30
