name: Build FrankiFlow Admin App Android APK

on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_SUPABASE_URL: https://bdeajozhylypiidrldka.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FX7QKUBZQmwykGcgv8SdfQ_lGRZF8n2

jobs:
  build-apk:
    name: Build FrankiFlow Admin App 1.2.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Apply final safe-zone FrankiFlow launcher icons
        run: |
          cp assets/icon.png /tmp/franki-fallback-icon.png
          cp assets/adaptive-icon.png /tmp/franki-fallback-adaptive.png

          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1KZUHCcWMqRVb4fiuEkMPhHedoNHpDcUx' -o /tmp/frankiflow-icon.png || true
          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1vS3XK-leP3ExbjcXJfr1vrGzx3Z6mbyw' -o /tmp/frankiflow-adaptive.png || true

          if file /tmp/frankiflow-icon.png 2>/dev/null | grep -qi 'PNG image'; then
            cp /tmp/frankiflow-icon.png assets/icon.png
            echo 'Safe dark FrankiFlow regular icon applied.'
          else
            cp /tmp/franki-fallback-icon.png assets/icon.png
            echo 'Regular icon download failed; repository fallback retained.'
          fi

          if file /tmp/frankiflow-adaptive.png 2>/dev/null | grep -qi 'PNG image'; then
            cp /tmp/frankiflow-adaptive.png assets/adaptive-icon.png
            echo 'Final padded transparent adaptive foreground applied.'
          else
            cp /tmp/franki-fallback-adaptive.png assets/adaptive-icon.png
            echo 'Adaptive icon download failed; repository fallback retained.'
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FrankiFlow-Admin-App-1.2.2.apk
          sha256sum release/FrankiFlow-Admin-App-1.2.2.apk > release/FrankiFlow-Admin-App-1.2.2.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-1.2.2
          path: |
            release/FrankiFlow-Admin-App-1.2.2.apk
            release/FrankiFlow-Admin-App-1.2.2.apk.sha256
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    name: Install and launch FrankiFlow Admin App on Android emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-1.2.2
          path: release

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and smoke-test FrankiFlow Admin App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -eu
            mkdir -p smoke-test-output
            adb install -r release/FrankiFlow-Admin-App-1.2.2.apk
            adb shell pm list packages | grep 'package:de.frankiflow.admin'
            adb logcat -c
            adb shell monkey -p de.frankiflow.admin -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > smoke-test-output/window-focus.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/window-focus.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml smoke-test-output/window.xml
            adb exec-out screencap -p > smoke-test-output/login-screen.png
            adb logcat -d > smoke-test-output/logcat.txt
            adb shell dumpsys package de.frankiflow.admin > smoke-test-output/package.txt
            adb shell ps -A | grep 'de.frankiflow.admin' > smoke-test-output/process.txt || true
            grep -q 'de.frankiflow.admin' smoke-test-output/process.txt
            grep -Eiq 'FrankiFlow Admin App|Willkommen zurück|Welcome back' smoke-test-output/window.xml
            grep -Eiq 'Anmelden|Sign in' smoke-test-output/window.xml
            grep -Eiq 'info@frankiflow.de' smoke-test-output/window.xml
            ! sh -c "grep -A12 'FATAL EXCEPTION' smoke-test-output/logcat.txt | grep -q 'de.frankiflow.admin'"
            echo 'PASS: FrankiFlow Admin App 1.2.2 installed, launched and rendered without a fatal app crash.' | tee smoke-test-output/result.txt

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-Smoke-Test-1.2.2
          path: smoke-test-output
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    name: Publish permanent APK download
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download tested APK artifact
        uses: actions/download-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-1.2.2
          path: release

      - name: Prepare stable APK filenames
        run: |
          cp release/FrankiFlow-Admin-App-1.2.2.apk release/FrankiFlow-Admin.apk
          sha256sum release/FrankiFlow-Admin.apk > release/FrankiFlow-Admin.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          TITLE="FrankiFlow Admin App Android Build ${GITHUB_RUN_NUMBER}"
          NOTES="Tested Android APK built from commit ${GITHUB_SHA}.\n\nPermanent latest-download URL:\nhttps://github.com/${GITHUB_REPOSITORY}/releases/latest/download/FrankiFlow-Admin.apk"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/FrankiFlow-Admin.apk \
              release/FrankiFlow-Admin.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              release/FrankiFlow-Admin.apk \
              release/FrankiFlow-Admin.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

          echo "Latest APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/FrankiFlow-Admin.apk"
