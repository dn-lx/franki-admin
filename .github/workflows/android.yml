name: Build and Publish FrankiFlow Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_SUPABASE_URL: https://bdeajozhylypiidrldka.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FX7QKUBZQmwykGcgv8SdfQ_lGRZF8n2
  APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
  APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}

jobs:
  build-publish-apk:
    name: Build APK, publish Release, update Appetize
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Apply FrankiFlow launcher icons
        run: |
          cp assets/icon.png /tmp/franki-fallback-icon.png
          cp assets/adaptive-icon.png /tmp/franki-fallback-adaptive.png

          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1KZUHCcWMqRVb4fiuEkMPhHedoNHpDcUx' -o /tmp/frankiflow-icon.png || true
          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1vS3XK-leP3ExbjcXJfr1vrGzx3Z6mbyw' -o /tmp/frankiflow-adaptive.png || true

          if file /tmp/frankiflow-icon.png 2>/dev/null | grep -qi 'PNG image'; then
            cp /tmp/frankiflow-icon.png assets/icon.png
            echo 'FrankiFlow regular icon applied.'
          else
            cp /tmp/franki-fallback-icon.png assets/icon.png
            echo 'Regular icon download failed; repository fallback retained.'
          fi

          if file /tmp/frankiflow-adaptive.png 2>/dev/null | grep -qi 'PNG image'; then
            cp /tmp/frankiflow-adaptive.png assets/adaptive-icon.png
            echo 'FrankiFlow adaptive foreground applied.'
          else
            cp /tmp/franki-fallback-adaptive.png assets/adaptive-icon.png
            echo 'Adaptive icon download failed; repository fallback retained.'
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare permanent APK filename
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FrankiFlow-Admin.apk
          sha256sum release/FrankiFlow-Admin.apk > release/FrankiFlow-Admin.apk.sha256

      - name: Keep GitHub Actions artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: FrankiFlow-Admin-App-Android-${{ github.run_number }}
          path: |
            release/FrankiFlow-Admin.apk
            release/FrankiFlow-Admin.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          TITLE="FrankiFlow Admin App Android Build ${GITHUB_RUN_NUMBER}"
          LATEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/FrankiFlow-Admin.apk"
          NOTES="FrankiFlow Admin App Android APK built from commit ${GITHUB_SHA}.\n\nPermanent latest APK:\n${LATEST_URL}"

          gh release create "$TAG" \
            release/FrankiFlow-Admin.apk \
            release/FrankiFlow-Admin.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest \
            --repo "$GITHUB_REPOSITORY"

          echo "Permanent latest APK: ${LATEST_URL}"

      - name: Upload latest APK to Appetize
        if: ${{ env.APPETIZE_API_TOKEN != '' && env.APPETIZE_PUBLIC_KEY != '' }}
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ env.APPETIZE_API_TOKEN }}
          publicKey: ${{ env.APPETIZE_PUBLIC_KEY }}
          appFile: release/FrankiFlow-Admin.apk
          platform: android
          fileType: apk
          note: FrankiFlow Admin App - GitHub build ${{ github.run_number }}
          timeout: 600

      - name: Show permanent Appetize emulator link
        if: ${{ env.APPETIZE_API_TOKEN != '' && env.APPETIZE_PUBLIC_KEY != '' }}
        run: |
          echo "Appetize emulator: https://appetize.io/app/${APPETIZE_PUBLIC_KEY}"

      - name: Appetize setup reminder
        if: ${{ env.APPETIZE_API_TOKEN == '' || env.APPETIZE_PUBLIC_KEY == '' }}
        run: |
          echo 'APK release completed. Appetize upload was skipped because APPETIZE_API_TOKEN and/or APPETIZE_PUBLIC_KEY are not configured in GitHub Actions secrets.'
